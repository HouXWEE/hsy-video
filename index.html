<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>演讲视频在线播放</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }
    .title {
      font-size: 17px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-weight: 500;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    .controls-bar {
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.5);
    }
    .line-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .line-label {
      font-size: 12px;
      color: #94a3b8;
      margin-right: 4px;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #334155;
      color: #e2e8f0;
      font-size: 12px;
      padding: 6px 11px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #475569; }
    .btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
      font-weight: 600;
    }
    .btn-download {
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
    }
    .status {
      padding: 0 20px 14px;
      font-size: 12px;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">演讲视频 · 慢慢就爱上内蒙</div>
      <div class="badge" id="net-badge">智能加速中</div>
    </div>

    <div class="video-wrap">
      <video
        id="player"
        controls
        playsinline
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5-page"
        preload="metadata"
        poster="./poster.jpg"
      >
        <source src="https://fastly.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4" type="video/mp4" />
        <source src="https://gcore.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4" type="video/mp4" />
        <source src="https://cdn.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4" type="video/mp4" />
        <source src="./video.mp4" type="video/mp4" />
        您的浏览器不支持直接播放，请点击下方按钮下载观看。
      </video>
    </div>

    <div class="controls-bar">
      <div class="line-group">
        <span class="line-label">播放线路：</span>
        <button class="btn active" id="btn-0" onclick="switchLine(0)">线路1 (Fastly加速)</button>
        <button class="btn" id="btn-1" onclick="switchLine(1)">线路2 (GCore加速)</button>
        <button class="btn" id="btn-2" onclick="switchLine(2)">线路3 (CDN加速)</button>
        <button class="btn" id="btn-3" onclick="switchLine(3)">线路4 (源站直连)</button>
      </div>
      <a class="btn btn-download" id="download-link" href="https://fastly.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4" target="_blank" download="演讲视频_尚耘.mp4">下载视频 (14MB)</a>
    </div>
    <div class="status" id="status-text">已自动为您匹配最佳高速播放节点，点击画面即可播放。若缓冲较慢可点击上方切换线路。</div>
  </div>

  <script>
    const BASES = [
      { name: "Fastly 加速", base: "https://fastly.jsdelivr.net/gh/HouXWEE/hsy-video@main/" },
      { name: "GCore 加速", base: "https://gcore.jsdelivr.net/gh/HouXWEE/hsy-video@main/" },
      { name: "CDN 加速", base: "https://cdn.jsdelivr.net/gh/HouXWEE/hsy-video@main/" },
      { name: "源站直连", base: "./" }
    ];

    const video = document.getElementById("player");
    const badge = document.getElementById("net-badge");
    const statusText = document.getElementById("status-text");
    const downloadLink = document.getElementById("download-link");
    let currentLine = 0;

    function supportsNativeHls() {
      return video.canPlayType("application/vnd.apple.mpegurl") !== "";
    }

    function applyLine(idx, autoPlay) {
      currentLine = idx;
      for (let i = 0; i < BASES.length; i++) {
        const b = document.getElementById("btn-" + i);
        if (b) b.classList.toggle("active", i === idx);
      }
      const item = BASES[idx];
      const prevTime = video.currentTime || 0;
      const wasPlaying = !video.paused;

      video.poster = item.base + "poster.jpg";
      downloadLink.href = item.base + "video.mp4";

      // On iOS/Safari (including WeChat iOS), native HLS (m3u8) plays 400KB chunks with instant start
      if (supportsNativeHls()) {
        video.src = item.base + "hls/playlist.m3u8";
      } else {
        video.src = item.base + "video.mp4";
      }

      video.load();
      if (prevTime > 0) {
        video.addEventListener("loadedmetadata", function restore() {
          video.currentTime = prevTime;
          video.removeEventListener("loadedmetadata", restore);
        });
      }
      if (autoPlay || wasPlaying) {
        video.play().catch(function(){});
      }
      badge.textContent = item.name;
      statusText.textContent = "当前节点：" + item.name + "（点击视频中间播放按钮即可观看，支持全屏）";
    }

    function switchLine(idx) {
      applyLine(idx, true);
    }

    // Automatically race all CDN nodes using poster.jpg and pick the fastest one
    (function autoSelectFastest() {
      let settled = false;
      BASES.forEach(function(item, idx) {
        const controller = new AbortController();
        const timer = setTimeout(function() { controller.abort(); }, 4000);
        fetch(item.base + "poster.jpg", { method: "HEAD", mode: "cors", signal: controller.signal })
          .then(function(res) {
            clearTimeout(timer);
            if (res.ok && !settled && video.paused && video.currentTime === 0) {
              settled = true;
              applyLine(idx, false);
            }
          })
          .catch(function() { clearTimeout(timer); });
      });
    })();

    // Auto fallback to next line if video errors out
    video.addEventListener("error", function() {
      if (currentLine + 1 < BASES.length) {
        applyLine(currentLine + 1, false);
      }
    });
  </script>
</body>
</html>
