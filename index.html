<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>video.mp4</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0e0e0e;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      outline: none;
      background-color: #000;
    }
  </style>
</head>
<body>
  <video
    id="v"
    controls
    autoplay
    playsinline
    webkit-playsinline
    preload="auto"
    poster="./poster.jpg"
    src="https://fastly.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4"
  >
    <source src="https://fastly.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4" type="video/mp4" />
    <source src="https://gcore.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4" type="video/mp4" />
    <source src="https://cdn.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4" type="video/mp4" />
    <source src="./video.mp4" type="video/mp4" />
  </video>
  <script>
    const v = document.getElementById("v");
    const lines = [
      "https://fastly.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4",
      "https://gcore.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4",
      "https://cdn.jsdelivr.net/gh/HouXWEE/hsy-video@main/video.mp4",
      "./video.mp4"
    ];
    let idx = 0;
    v.addEventListener("error", function() {
      idx++;
      if (idx < lines.length) {
        v.src = lines[idx];
        v.load();
        v.play().catch(function(){});
      }
    });
  </script>
</body>
</html>
